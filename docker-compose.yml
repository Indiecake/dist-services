services:
  postgres:
    image: postgres:16-alpine
    container_name: dist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform

  kafka:
    image: apache/kafka:4.3.0
    container_name: dist-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    networks:
      - platform

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: dist-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - platform

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: dist-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - platform

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: dist-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4319}:4317"
      - "${OTEL_HTTP_PORT:-4320}:4318"
      - "${OTEL_METRICS_PORT:-9464}:9464"
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - platform

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: dist-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      otel-collector:
        condition: service_started
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - platform

  grafana:
    image: grafana/grafana:11.1.0
    container_name: dist-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - platform

networks:
  platform:
    name: dist-platform

volumes:
  postgres_data:
  kafka_data:
  grafana_data:
